<mat-toolbar>
  <mat-icon>auto_awesome</mat-icon>
  <span>{{ title }}</span>
</mat-toolbar>

<nav mat-tab-nav-bar [tabPanel]="tabPanel">
  @for (tab of navigationTabs(); track tab) {
    <a mat-tab-link [active]="tab.active" [routerLink]="tab.link">
      <mat-icon>{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel>
  <router-outlet />
</mat-tab-nav-panel>
